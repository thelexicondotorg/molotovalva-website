<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MOLOTOVALVA</title>
    <meta name="description" content="MOLOTOVALVA" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet" />
  </head>
  <body class="bg-black text-white min-h-screen flex flex-col justify-center items-center font-mono selection:bg-[#00E900] selection:text-black">
    
    <!-- Landing Main Content Area (Centered Viewport) -->
    <main class="w-full flex-grow flex flex-col items-center justify-center px-6">
      
      <!-- Central Portal Section -->
      <section class="flex flex-col items-center justify-center text-center">
        
        <!-- Central Media Portal: 300px x 300px Circular Mask -->
        <div class="media-portal border border-neutral-900 shadow-2xl" id="media-portal">
          <img 
            src="/images/01-click_to_enter.jpg" 
            alt="Central Media Portal" 
            class="w-full h-full object-cover"
          />
        </div>

        <!-- Interactive Terminal Prompt -->
        <div class="terminal-prompt" role="button" tabindex="0" id="terminal-prompt">
          <span class="prompt-prefix">&gt;:&nbsp;</span><span id="prompt-text"></span><span class="terminal-cursor">_</span>
        </div>

        <!-- Scroll Indicator -->
        <div id="scroll-indicator" class="opacity-0 fixed bottom-10 left-1/2 -translate-x-1/2 flex justify-center">
          <svg width="40" height="80" viewBox="0 0 40 80" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
            <!-- Mouse Body -->
            <rect x="10" y="5" width="20" height="35" rx="10" />
            <line class="scroll-anim" x1="20" y1="5" x2="20" y2="15" />
            <!-- Chevrons -->
            <path class="scroll-anim" d="M12 50 L20 58 L28 50" />
            <path class="scroll-anim" d="M12 60 L20 68 L28 60" />
          </svg>
        </div>

      </section>

    </main>

    <!-- Application Script Entrypoint -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
